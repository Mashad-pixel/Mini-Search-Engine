<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Document · Mini Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>try{var t=localStorage.getItem("mini-search-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Mini Search</span>
    </a>
    <div class="topbar-actions">
      <a class="ghost-link" href="/">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Back to search</span>
      </a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="page page-doc">
    <article class="doc">
      <h1 id="doc-title" class="doc-title">Loading…</h1>
      <div class="doc-meta">
        <span id="doc-category" class="doc-category" hidden></span>
        <span id="doc-id" class="doc-id mono"></span>
      </div>
      <div id="doc-status" class="doc-status" role="status" aria-live="polite"></div>
      <div id="doc-text" class="doc-text"></div>
    </article>
  </main>

  <script>
    (function () {
      "use strict";

      var titleEl = document.getElementById("doc-title");
      var categoryEl = document.getElementById("doc-category");
      var idEl = document.getElementById("doc-id");
      var statusEl = document.getElementById("doc-status");
      var textEl = document.getElementById("doc-text");

      function setStatus(message, kind) {
        statusEl.textContent = message;
        statusEl.className = kind ? "doc-status " + kind : "doc-status";
      }

      function showError(message) {
        titleEl.textContent = "Document unavailable";
        categoryEl.hidden = true;
        setStatus(message, "error");
        textEl.replaceChildren();
      }

      var docId = new URLSearchParams(window.location.search).get("id");
      if (!docId) {
        showError("No document id was given.");
        return;
      }

      idEl.textContent = docId;
      setStatus("Loading…", "loading");

      fetch("/document/" + encodeURIComponent(docId))
        .then(function (response) {
          if (response.status === 404) {
            throw new Error("Document " + docId + " was not found.");
          }
          if (!response.ok) {
            throw new Error("The server returned " + response.status + ".");
          }
          return response.json();
        })
        .then(function (doc) {
          document.title = doc.doc_id + " · Mini Search";
          titleEl.textContent = doc.doc_id;
          categoryEl.textContent = doc.category || "";
          categoryEl.hidden = !doc.category;
          idEl.textContent = doc.doc_id;

          var fragment = document.createDocumentFragment();
          var blocks = String(doc.text || "").split(/\n{2,}/);
          for (var i = 0; i < blocks.length; i++) {
            var block = blocks[i];
            if (!block.trim()) continue;
            var p = document.createElement("p");
            p.textContent = block;
            fragment.appendChild(p);
          }
          textEl.replaceChildren(fragment);
          setStatus("", "");
        })
        .catch(function (error) {
          showError(error.message);
        });
    })();
  </script>

  <script>
    (function () {
      "use strict";
      var key = "mini-search-theme";
      var stored = localStorage.getItem(key);
      if (stored) document.documentElement.dataset.theme = stored;
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var current =
          document.documentElement.dataset.theme ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem(key, next);
      });
    })();
  </script>
</body>
</html>
