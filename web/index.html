<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mini Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>try{var t=localStorage.getItem("mini-search-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Mini Search</span>
    </a>
    <div class="topbar-actions">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1 class="hero-title">
        Search your corpus
      </h1>
      <p class="hero-sub">Find documents by keyword, by meaning, or both. Everything runs on your machine.</p>

      <div id="search-wrap" class="search-wrap">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            id="query"
            type="search"
            name="q"
            placeholder='Try "machine learning" or photosynthesis'
            autocomplete="off"
            autofocus
            role="combobox"
            aria-label="Search query"
            aria-autocomplete="list"
            aria-controls="suggestions"
            aria-expanded="false">
          <kbd class="key-hint" aria-hidden="true">/</kbd>
          <button id="search-btn" type="button">
            <span class="btn-label">Search</span>
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions" hidden></div>
      </div>

      <div id="mode-toggle" class="mode-toggle" role="radiogroup" aria-label="Search mode">
        <span class="mode-slider" aria-hidden="true"></span>
        <label class="mode-option">
          <input type="radio" name="mode" value="lexical">
          <span>Keywords</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="semantic">
          <span>Semantic</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="hybrid" checked>
          <span>Hybrid</span>
        </label>
      </div>

      <p class="tip">
        Wrap words in <code>"quotes"</code> to require an exact phrase.
        Press <kbd>/</kbd> to focus.
      </p>
      <div id="examples" class="examples">
        <span>Try</span>
        <button type="button" data-query="photosynthesis">photosynthesis</button>
        <button type="button" data-query="&quot;machine learning&quot;">"machine learning"</button>
        <button type="button" data-query="how do volcanoes form">how do volcanoes form</button>
      </div>
    </section>

    <fieldset id="facets" class="facets" hidden>
      <legend class="visually-hidden">Filter by category</legend>
      <div id="facet-list" class="facet-list"></div>
      <button id="facet-clear" class="facet-clear" type="button" hidden>Clear filters</button>
    </fieldset>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="results" class="results" aria-label="Search results"></section>
  </main>

  <noscript>This page needs JavaScript to run searches.</noscript>
</body>
</html>
